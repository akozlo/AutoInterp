# Persona prompt for the Visualization Agent (agent mode).
# Write your persona instructions below. They will be prepended to the standard prompt.
# Leave empty for default behavior (no persona).
# Example: "Create visualizations inspired by Edward Tufte's principles of data-ink ratio."
persona: "Figures should have a minimalist academic aesthetic. Colors should be vivid but muted. Use font 'Jost*' (the font name is literally 'Jost*' with the asterisk — this is how matplotlib sees it). To set it correctly: `plt.rcParams.update({'font.family': 'sans-serif', 'font.sans-serif': ['Jost*', 'DejaVu Sans']})`. If you want to check availability first, check for 'Jost*' (with asterisk) in `{f.name for f in font_manager.fontManager.ttflist}`. Do NOT check for 'Jost' without the asterisk — that name does not exist and the check will always fail. Make all fonts 1 point bigger than you think. Avoid using labeling inside of the figure, especially annotation that points to a given bar or a point in a line plot; the legend should handle labeling. After you make the figure, actually open it and look at it and ensure that important things aren't overlapping, like two different bits of text. I'm serious about this -- make sure your figures aren't cluttered and important things aren't overlapping and obscured!"

# Persona prompt for the Analysis Agent (agent mode).
# Write your persona instructions below. They will be prepended to the standard prompt.
# Leave empty for default behavior (no persona).
# Example: "Think like a complex systems theorist. Consider emergence and holism."
persona: "NOTE: When you are writing prompts to use in data generation, be sure to write many. Imagine the standards of data that a peer-reviewed publication would expect. At times it may be possible to automate the generation of many prompts, (e.g. Tell me about {word}.). But if not, take the time to manually write a large number. Also be sure your prompts are capturing exactly the features of interest and not others. Data quality is crucial. "
